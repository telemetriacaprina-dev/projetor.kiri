<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#111111">

<title>MATRIZ PROJECT</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eeeeee;
  color: #222;
}

/* =====================================================
   CABEÇALHO
===================================================== */

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 6px 0 0;
  color: #bbbbbb;
  font-size: 13px;
}

/* =====================================================
   CONTAINER
===================================================== */

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* =====================================================
   FORMULÁRIO
===================================================== */

.upload-box {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.upload-box h2 {
  margin-top: 0;
}

input,
button {
  font-family: inherit;
}

input[type="text"],
input[type="file"] {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #cccccc;
}

/* =====================================================
   BOTÕES
===================================================== */

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #333;
}

button:active {
  transform: scale(.97);
}

/* =====================================================
   BARRA DE BUSCA
===================================================== */

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.toolbar input {
  margin: 0;
}

/* =====================================================
   PROJETOS
===================================================== */

#projects {
  display: grid;
  grid-template-columns:
  repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}

.project-card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.project-card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #dddddd;
}

.project-info {
  padding: 15px;
}

.project-info h3 {
  margin: 0 0 8px;
}

.project-info small {
  color: #666;
}

.card-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

/* =====================================================
   MODO PROJETOR
===================================================== */

.projector {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
}

.projector.active {
  display: flex;
  flex-direction: column;
}

/* =====================================================
   CONTROLES DO PROJETOR
===================================================== */

.projector-controls {
  background: #151515;
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  z-index: 20;
}

.projector-controls button {
  background: #333;
  padding: 10px 12px;
  font-size: 13px;
}

.projector-controls button:hover {
  background: #555;
}

/* =====================================================
   ZOOM MANUAL
===================================================== */

.manual-zoom-panel {
  background: #222;
  color: white;
  padding: 12px 20px;
  display: none;
  align-items: center;
  gap: 15px;
  z-index: 20;
}

.manual-zoom-panel input {
  flex: 1;
  max-width: 700px;
}

#zoomValue {
  min-width: 60px;
  text-align: right;
}

/* =====================================================
   ÁREA DE PROJEÇÃO
===================================================== */

.projector-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
}

/* =====================================================
   IMAGEM
===================================================== */

#projectImage {
  position: absolute;

  max-width: none;
  max-height: none;

  user-select: none;
  -webkit-user-drag: none;

  transform-origin: center center;

  cursor: grab;
}

#projectImage.dragging {
  cursor: grabbing;
}

/* =====================================================
   CALIBRAÇÃO
===================================================== */

.calibration {
  position: absolute;

  bottom: 25px;
  left: 50%;

  transform: translateX(-50%);

  color: white;

  text-align: center;

  font-size: 14px;

  background: rgba(0,0,0,.75);

  padding: 12px 20px;

  border-radius: 10px;

  z-index: 30;
}

.calibration-line {
  width: 200px;
  height: 4px;

  background: red;

  margin: 10px auto;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  .container {
    padding: 12px;
  }

  header h1 {
    font-size: 20px;
  }

  .projector-controls {
    justify-content: center;
  }

  .manual-zoom-panel {
    padding: 10px;
  }

}

</style>
</head>

<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

  <h1>📐 MATRIZ PROJECT</h1>

  <p>
    Biblioteca e projeção para corte,
    vinco e traçado de matrizes
  </p>

</header>


<!-- =====================================================
     BIBLIOTECA
===================================================== -->

<div class="container">


  <div class="upload-box">

    <h2>📁 Novo Projeto</h2>

    <input
      type="text"
      id="projectName"
      placeholder="Nome do projeto">

    <input
      type="file"
      id="projectFile"
      accept="image/*">

    <button onclick="saveProject()">
      💾 Salvar Projeto
    </button>

  </div>


  <div class="toolbar">

    <input
      type="text"
      id="search"
      placeholder="🔎 Buscar projeto..."
      oninput="renderProjects()">

    <button onclick="renderProjects()">
      🔄 Atualizar
    </button>

  </div>


  <div id="projects"></div>


</div>


<!-- =====================================================
     MODO PROJETOR
===================================================== -->

<div
  class="projector"
  id="projector">


  <!-- CONTROLES -->

  <div class="projector-controls">

    <button onclick="autoFit()">
      🎯 Enquadrar Auto
    </button>

    <button onclick="toggleManualZoom()">
      🔎 Zoom Manual
    </button>

    <button onclick="zoomIn()">
      ➕ Zoom
    </button>

    <button onclick="zoomOut()">
      ➖ Zoom
    </button>

    <button onclick="rotateLeft()">
      ↺
    </button>

    <button onclick="rotateRight()">
      ↻
    </button>

    <button onclick="mirrorImage()">
      ↔ Espelhar
    </button>

    <button onclick="toggleLock()">
      🔓 Travar
    </button>

    <button onclick="toggleCalibration()">
      📏 Calibrar
    </button>

    <button onclick="toggleFullscreen()">
      ⛶ Tela Cheia
    </button>

    <button onclick="closeProjector()">
      ✖ Fechar
    </button>

  </div>


  <!-- ZOOM MANUAL -->

  <div
    class="manual-zoom-panel"
    id="manualZoomPanel">

    <span>🔎 Zoom</span>

    <input
      type="range"
      id="zoomSlider"
      min="0.05"
      max="5"
      step="0.01"
      value="1"
      oninput="manualZoom(this.value)">

    <span id="zoomValue">
      100%
    </span>

  </div>


  <!-- ÁREA DE PROJEÇÃO -->

  <div
    class="projector-area"
    id="projectorArea">


    <img
      id="projectImage"
      draggable="false">


    <!-- CALIBRAÇÃO -->

    <div
      class="calibration"
      id="calibration"
      style="display:none">

      📏 LINHA DE REFERÊNCIA

      <div class="calibration-line"></div>

      Ajuste o zoom até a linha projetada
      corresponder à medida desejada.

    </div>


  </div>


</div>



<script>

/* =====================================================
   BANCO DE DADOS
===================================================== */

let db;

const databaseRequest =
  indexedDB.open(
    "MatrizProjectDB",
    1
  );


databaseRequest.onupgradeneeded =
function(event) {

  db = event.target.result;


  if (
    !db.objectStoreNames.contains(
      "projects"
    )
  ) {

    db.createObjectStore(
      "projects",
      {
        keyPath: "id",
        autoIncrement: true
      }
    );

  }

};


databaseRequest.onsuccess =
function(event) {

  db = event.target.result;

  renderProjects();

};


databaseRequest.onerror =
function() {

  alert(
    "Erro ao iniciar o banco de dados."
  );

};



/* =====================================================
   SALVAR PROJETO
===================================================== */

function saveProject() {

  const name =
    document
      .getElementById("projectName")
      .value
      .trim();


  const file =
    document
      .getElementById("projectFile")
      .files[0];


  if (!name || !file) {

    alert(
      "Informe o nome e selecione uma imagem."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
  function(event) {

    const transaction =
      db.transaction(
        ["projects"],
        "readwrite"
      );


    const store =
      transaction.objectStore(
        "projects"
      );


    store.add({

      name: name,

      image:
        event.target.result,

      date:
        new Date()
        .toLocaleString("pt-BR")

    });


    transaction.oncomplete =
    function() {

      document
        .getElementById("projectName")
        .value = "";


      document
        .getElementById("projectFile")
        .value = "";


      renderProjects();


      alert(
        "Projeto salvo com sucesso!"
      );

    };

  };


  reader.readAsDataURL(file);

}



/* =====================================================
   LISTAR PROJETOS
===================================================== */

function renderProjects() {

  if (!db)
    return;


  const container =
    document
      .getElementById("projects");


  container.innerHTML = "";


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const transaction =
    db.transaction(
      ["projects"],
      "readonly"
    );


  const store =
    transaction.objectStore(
      "projects"
    );


  const request =
    store.openCursor();


  request.onsuccess =
  function(event) {

    const cursor =
      event.target.result;


    if (cursor) {

      const project =
        cursor.value;


      if (
        project.name
        .toLowerCase()
        .includes(search)
      ) {

        const card =
          document.createElement("div");


        card.className =
          "project-card";


        card.innerHTML = `

          <img
            src="${project.image}"
            alt="${project.name}">

          <div class="project-info">

            <h3>
              ${project.name}
            </h3>

            <small>
              ${project.date}
            </small>

            <div class="card-buttons">

              <button
                onclick="openProject(${project.id})">

                🔦 Projetar

              </button>


              <button
                onclick="deleteProject(${project.id})">

                🗑️ Excluir

              </button>

            </div>

          </div>

        `;


        container.appendChild(card);

      }


      cursor.continue();

    }


    else if (
      container.innerHTML === ""
    ) {

      container.innerHTML = `
        <p>
          Nenhum projeto encontrado.
        </p>
      `;

    }

  };

}



/* =====================================================
   EXCLUIR PROJETO
===================================================== */

function deleteProject(id) {

  if (
    !confirm(
      "Deseja realmente excluir este projeto?"
    )
  ) {

    return;

  }


  const transaction =
    db.transaction(
      ["projects"],
      "readwrite"
    );


  const store =
    transaction.objectStore(
      "projects"
    );


  store.delete(id);


  transaction.oncomplete =
    renderProjects;

}



/* =====================================================
   ABRIR PROJETO
===================================================== */

function openProject(id) {

  const transaction =
    db.transaction(
      ["projects"],
      "readonly"
    );


  const store =
    transaction.objectStore(
      "projects"
    );


  const request =
    store.get(id);


  request.onsuccess =
  function() {

    const project =
      request.result;


    const image =
      document
        .getElementById("projectImage");


    document
      .getElementById("projector")
      .classList
      .add("active");


    image.onload =
    function() {

      resetTransform();


      setTimeout(
        autoFit,
        100
      );

    };


    image.src =
      project.image;

  };

}



/* =====================================================
   ESTADO DA IMAGEM
===================================================== */

let scale = 1;

let rotation = 0;

let mirrored = false;

let locked = false;

let positionX = 0;

let positionY = 0;



/* =====================================================
   ATUALIZAR TRANSFORMAÇÃO
===================================================== */

function updateTransform() {

  const image =
    document
      .getElementById("projectImage");


  const mirror =
    mirrored
      ? -1
      : 1;


  image.style.transform = `

    translate(
      ${positionX}px,
      ${positionY}px
    )

    scale(
      ${scale * mirror},
      ${scale}
    )

    rotate(
      ${rotation}deg
    )

  `;

}



/* =====================================================
   ENQUADRAMENTO AUTOMÁTICO
===================================================== */

function autoFit() {

  if (locked)
    return;


  const image =
    document
      .getElementById("projectImage");


  const area =
    document
      .getElementById("projectorArea");


  if (
    !image.naturalWidth ||
    !image.naturalHeight
  ) {

    return;

  }


  const areaWidth =
    area.clientWidth;


  const areaHeight =
    area.clientHeight;


  const imageWidth =
    image.naturalWidth;


  const imageHeight =
    image.naturalHeight;


  const scaleX =
    areaWidth / imageWidth;


  const scaleY =
    areaHeight / imageHeight;


  scale =
    Math.min(
      scaleX,
      scaleY
    ) * 0.95;


  positionX = 0;

  positionY = 0;

  rotation = 0;

  mirrored = false;


  updateTransform();

  updateZoomSlider();

}



/* =====================================================
   ZOOM MANUAL
===================================================== */

function toggleManualZoom() {

  const panel =
    document
      .getElementById(
        "manualZoomPanel"
      );


  if (
    panel.style.display ===
    "flex"
  ) {

    panel.style.display =
      "none";

  }

  else {

    panel.style.display =
      "flex";

  }

}



function manualZoom(value) {

  if (locked)
    return;


  scale =
    parseFloat(value);


  updateTransform();

  updateZoomValue();

}



function updateZoomSlider() {

  const slider =
    document
      .getElementById(
        "zoomSlider"
      );


  slider.value =
    Math.min(
      Math.max(
        scale,
        parseFloat(slider.min)
      ),
      parseFloat(slider.max)
    );


  updateZoomValue();

}



function updateZoomValue() {

  document
    .getElementById(
      "zoomValue"
    )
    .textContent =

    Math.round(
      scale * 100
    ) + "%";

}



/* =====================================================
   ZOOM +
===================================================== */

function zoomIn() {

  if (locked)
    return;


  scale += 0.1;


  updateTransform();

  updateZoomSlider();

}



/* =====================================================
   ZOOM -
===================================================== */

function zoomOut() {

  if (locked)
    return;


  scale -= 0.1;


  if (scale < 0.05) {

    scale = 0.05;

  }


  updateTransform();

  updateZoomSlider();

}



/* =====================================================
   ROTAÇÃO
===================================================== */

function rotateLeft() {

  if (locked)
    return;


  rotation -= 90;


  updateTransform();

}



function rotateRight() {

  if (locked)
    return;


  rotation += 90;


  updateTransform();

}



/* =====================================================
   ESPELHAR
===================================================== */

function mirrorImage() {

  if (locked)
    return;


  mirrored =
    !mirrored;


  updateTransform();

}



/* =====================================================
   TRAVAR
===================================================== */

function toggleLock() {

  locked =
    !locked;


  const image =
    document
      .getElementById(
        "projectImage"
      );


  if (locked) {

    image.style.cursor =
      "not-allowed";

  }

  else {

    image.style.cursor =
      "grab";

  }


  alert(

    locked

      ? "🔒 Imagem travada."

      : "🔓 Imagem destravada."

  );

}



/* =====================================================
   RESET
===================================================== */

function resetTransform() {

  scale = 1;

  rotation = 0;

  mirrored = false;

  locked = false;

  positionX = 0;

  positionY = 0;


  updateTransform();

  updateZoomSlider();

}



/* =====================================================
   CALIBRAÇÃO
===================================================== */

function toggleCalibration() {

  const calibration =
    document
      .getElementById(
        "calibration"
      );


  calibration.style.display =

    calibration.style.display ===
    "none"

      ? "block"

      : "none";

}



/* =====================================================
   TELA CHEIA
===================================================== */

function toggleFullscreen() {

  const projector =
    document
      .getElementById(
        "projector"
      );


  if (
    !document.fullscreenElement
  ) {

    projector
      .requestFullscreen()
      .catch(() => {});

  }

  else {

    document
      .exitFullscreen();

  }

}



/* =====================================================
   FECHAR PROJETOR
===================================================== */

function closeProjector() {

  document
    .getElementById(
      "projector"
    )
    .classList
    .remove("active");


  if (
    document.fullscreenElement
  ) {

    document
      .exitFullscreen();

  }

}



/* =====================================================
   ARRASTAR IMAGEM
===================================================== */

const image =
  document
    .getElementById(
      "projectImage"
    );


let dragging = false;

let startX = 0;

let startY = 0;

let initialX = 0;

let initialY = 0;



/* MOUSE */

image.addEventListener(
  "mousedown",
  function(event) {

    if (locked)
      return;


    dragging = true;


    image.classList.add(
      "dragging"
    );


    startX =
      event.clientX;


    startY =
      event.clientY;


    initialX =
      positionX;


    initialY =
      positionY;

  }
);


window.addEventListener(
  "mousemove",
  function(event) {

    if (
      !dragging ||
      locked
    )
      return;


    positionX =

      initialX +
      (
        event.clientX -
        startX
      );


    positionY =

      initialY +
      (
        event.clientY -
        startY
      );


    updateTransform();

  }
);


window.addEventListener(
  "mouseup",
  function() {

    dragging = false;


    image.classList.remove(
      "dragging"
    );

  }
);



/* =====================================================
   TOQUE - ARRASTAR
===================================================== */

image.addEventListener(
  "touchstart",
  function(event) {

    if (
      locked ||
      event.touches.length !== 1
    )
      return;


    dragging = true;


    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    initialX =
      positionX;


    initialY =
      positionY;

  },
  { passive: false }
);


image.addEventListener(
  "touchmove",
  function(event) {

    if (
      !dragging ||
      locked ||
      event.touches.length !== 1
    )
      return;


    event.preventDefault();


    const touch =
      event.touches[0];


    positionX =

      initialX +
      (
        touch.clientX -
        startX
      );


    positionY =

      initialY +
      (
        touch.clientY -
        startY
      );


    updateTransform();

  },
  { passive: false }
);


image.addEventListener(
  "touchend",
  function() {

    dragging = false;

  }
);



/* =====================================================
   SERVICE WORKER
===================================================== */

if (
  "serviceWorker"
  in navigator
) {

  navigator
    .serviceWorker
    .register(
      "sw.js"
    )
    .catch(
      console.error
    );

}

</script>

</body>
</html>

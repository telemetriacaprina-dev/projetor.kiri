<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <meta name="theme-color" content="#111111">

  <title>Matriz Project</title>

  <link rel="manifest" href="manifest.json">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #bbb;
      font-size: 13px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button,
    input {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    button {
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      border: 1px solid #ccc;
    }

    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .upload-box h2 {
      margin-top: 0;
    }

    .upload-box input {
      width: 100%;
      margin-bottom: 10px;
      border: 1px solid #ccc;
    }

    #projects {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    .project-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #ddd;
    }

    .project-info {
      padding: 15px;
    }

    .project-info h3 {
      margin: 0 0 8px;
    }

    .project-info small {
      color: #666;
    }

    .card-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .projector {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      overflow: hidden;
    }

    .projector.active {
      display: flex;
      flex-direction: column;
    }

    .projector-controls {
      background: #151515;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 10;
    }

    .projector-controls button {
      background: #333;
      font-size: 13px;
      padding: 10px;
    }

    .projector-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #projectImage {
      max-width: none;
      max-height: none;

      transform-origin: center center;

      user-select: none;

      transition: transform .1s;
    }

    .calibration {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      font-size: 14px;
      background: rgba(0,0,0,.7);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .calibration-line {
      width: 200px;
      height: 4px;
      background: red;
      margin: 10px auto;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      header h1 {
        font-size: 20px;
      }

      .projector-controls {
        justify-content: center;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>📐 MATRIZ PROJECT</h1>

  <p>Biblioteca e projeção para corte, vinco e traçado de matrizes</p>

</header>


<div class="container">

  <div class="upload-box">

    <h2>Novo Projeto</h2>

    <input
      type="text"
      id="projectName"
      placeholder="Nome do projeto">

    <input
      type="file"
      id="projectFile"
      accept="image/*">

    <button onclick="saveProject()">

      💾 Salvar Projeto

    </button>

  </div>


  <div class="toolbar">

    <input
      type="text"
      id="search"
      placeholder="🔎 Buscar projeto..."
      oninput="renderProjects()">

    <button onclick="renderProjects()">

      🔄 Atualizar

    </button>

  </div>


  <div id="projects"></div>

</div>



<!-- MODO PROJETOR -->

<div class="projector" id="projector">

  <div class="projector-controls">

    <button onclick="zoomIn()">➕ Zoom</button>

    <button onclick="zoomOut()">➖ Zoom</button>

    <button onclick="rotateLeft()">↺</button>

    <button onclick="rotateRight()">↻</button>

    <button onclick="mirrorImage()">↔ Espelhar</button>

    <button onclick="toggleLock()">🔓 Travar</button>

    <button onclick="toggleCalibration()">📏 Calibrar</button>

    <button onclick="fullscreen()">⛶ Tela Cheia</button>

    <button onclick="closeProjector()">✖ Fechar</button>

  </div>


  <div class="projector-area">

    <img id="projectImage">

    <div
      class="calibration"
      id="calibration"
      style="display:none">

      📏 LINHA DE REFERÊNCIA

      <div class="calibration-line"></div>

      Ajuste o zoom até a linha corresponder à medida definida.

    </div>

  </div>

</div>



<script>

/* =====================================================
   MATRIZ PROJECT
   BANCO DE DADOS INDEXEDDB
===================================================== */

let db;

const request = indexedDB.open(
  "MatrizProjectDB",
  1
);


request.onupgradeneeded = function(event) {

  db = event.target.result;

  if (!db.objectStoreNames.contains("projects")) {

    db.createObjectStore(
      "projects",
      {
        keyPath: "id",
        autoIncrement: true
      }
    );

  }

};


request.onsuccess = function(event) {

  db = event.target.result;

  renderProjects();

};


request.onerror = function() {

  alert("Erro ao iniciar banco de dados.");

};



/* =====================================================
   SALVAR PROJETO
===================================================== */

function saveProject() {

  const name =
    document.getElementById("projectName").value;

  const file =
    document.getElementById("projectFile").files[0];


  if (!name || !file) {

    alert("Informe o nome e selecione uma imagem.");

    return;

  }


  const reader = new FileReader();


  reader.onload = function(event) {

    const transaction =
      db.transaction(
        ["projects"],
        "readwrite"
      );


    const store =
      transaction.objectStore("projects");


    store.add({

      name: name,

      image: event.target.result,

      date: new Date().toLocaleString()

    });


    transaction.oncomplete = function() {

      document.getElementById("projectName").value = "";

      document.getElementById("projectFile").value = "";

      renderProjects();

      alert("Projeto salvo com sucesso!");

    };

  };


  reader.readAsDataURL(file);

}



/* =====================================================
   LISTAR PROJETOS
===================================================== */

function renderProjects() {

  const container =
    document.getElementById("projects");


  container.innerHTML = "";


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const transaction =
    db.transaction(
      ["projects"],
      "readonly"
    );


  const store =
    transaction.objectStore("projects");


  const request =
    store.openCursor();


  request.onsuccess = function(event) {

    const cursor =
      event.target.result;


    if (cursor) {

      const project =
        cursor.value;


      if (
        project.name
          .toLowerCase()
          .includes(search)
      ) {

        const card =
          document.createElement("div");


        card.className =
          "project-card";


        card.innerHTML = `

          <img src="${project.image}">

          <div class="project-info">

            <h3>${project.name}</h3>

            <small>
              ${project.date}
            </small>

            <div class="card-buttons">

              <button onclick="openProject(${project.id})">

                🔦 Projetar

              </button>


              <button onclick="deleteProject(${project.id})">

                🗑️

              </button>

            </div>

          </div>

        `;


        container.appendChild(card);

      }


      cursor.continue();

    }

  };

}



/* =====================================================
   EXCLUIR PROJETO
===================================================== */

function deleteProject(id) {

  const confirmDelete =
    confirm("Deseja excluir este projeto?");


  if (!confirmDelete)
    return;


  const transaction =
    db.transaction(
      ["projects"],
      "readwrite"
    );


  const store =
    transaction.objectStore("projects");


  store.delete(id);


  transaction.oncomplete =
    renderProjects;

}



/* =====================================================
   ABRIR PROJETOR
===================================================== */

function openProject(id) {

  const transaction =
    db.transaction(
      ["projects"],
      "readonly"
    );


  const store =
    transaction.objectStore("projects");


  const request =
    store.get(id);


  request.onsuccess = function() {

    const project =
      request.result;


    document
      .getElementById("projectImage")
      .src =
      project.image;


    document
      .getElementById("projector")
      .classList
      .add("active");


    resetTransform();

  };

}



/* =====================================================
   CONTROLE DA IMAGEM
===================================================== */

let scale = 1;

let rotation = 0;

let mirrored = false;

let locked = false;



function updateTransform() {

  const image =
    document.getElementById("projectImage");


  const mirror =
    mirrored ? -1 : 1;


  image.style.transform = `

    scale(${scale * mirror}, ${scale})
    rotate(${rotation}deg)

  `;

}



function zoomIn() {

  if (locked) return;

  scale += 0.1;

  updateTransform();

}



function zoomOut() {

  if (locked) return;

  scale -= 0.1;

  if (scale < 0.1)
    scale = 0.1;

  updateTransform();

}



function rotateLeft() {

  if (locked) return;

  rotation -= 90;

  updateTransform();

}



function rotateRight() {

  if (locked) return;

  rotation += 90;

  updateTransform();

}



function mirrorImage() {

  if (locked) return;

  mirrored = !mirrored;

  updateTransform();

}



function toggleLock() {

  locked = !locked;


  alert(

    locked

      ? "Imagem travada."

      : "Imagem destravada."

  );

}



function resetTransform() {

  scale = 1;

  rotation = 0;

  mirrored = false;

  locked = false;

  updateTransform();

}



/* =====================================================
   CALIBRAÇÃO
===================================================== */

function toggleCalibration() {

  const calibration =
    document.getElementById("calibration");


  calibration.style.display =

    calibration.style.display === "none"

      ? "block"

      : "none";

}



/* =====================================================
   FULLSCREEN
===================================================== */

function fullscreen() {

  const projector =
    document.getElementById("projector");


  if (
    !document.fullscreenElement
  ) {

    projector.requestFullscreen();

  }

}



/* =====================================================
   FECHAR PROJETOR
===================================================== */

function closeProjector() {

  document
    .getElementById("projector")
    .classList
    .remove("active");


  if (document.fullscreenElement) {

    document.exitFullscreen();

  }

}



/* =====================================================
   SERVICE WORKER
===================================================== */

if ("serviceWorker" in navigator) {

  navigator
    .serviceWorker
    .register("sw.js");

}

</script>

</body>
  </html>
